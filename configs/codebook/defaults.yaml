dataset_name: hot3d
batch_size: 8
window_size: 30
gpu_id: 0

# optimization
max_epoch: 50
warm_up_iter: 2000
lr: 0.0003
milestones: [150000, 250000]
gamma: 0.05
weight_decay: 0.0
recons_loss: l1_smooth

# Loss
hand_rec: 1
commit: 1
dist: 1
orient: 1
contact: 0.1
hand_pos: 1
hand_rot: 1 


# vqvae arch
dim: 1763
dim_pose: 207
code_dim: 512
nb_code: 512
mu: 0.99
down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
output_emb_width: 512
vq_act: relu
vq_norm: null
num_quantizers: 6
shared_codebook: false
quantize_dropout_prob: 0.2
sample_codebook_temp: 0.5
ext: default

# logging and saving
name: codebook
is_continue: false
checkpoints_dir: ./logs
log_every: 10
save_latest: 500
save_every_e: 2
eval_every_e: 5
feat_bias: 5
which_epoch: all

# res predictor
vq_name: rvq_nq6_dc512_nc512_noshare_qdp0.2
seed: 0

# LatentAct
debug: false
motion_type: mano
model_type: tf
n_freq: 4
viz_every_e: 1000000000000
viz_every_t: 1000000000000
val_every_e: 5
num_workers: 8
num_threads: 8

# modality
video_feats: 768
text_feats: true
contact_grid: 16
contact_dim: 16
coord_sys: null
pred_cam: true
joints_loss: false
contact_map: true
residual_transf: false
return_indices: false

# settings
only_first: false
decoder_only: false
use_inpaint: false
setting: tasks
interpolate: false
traj_only: false
dataset_size: null

# eval
inference: false
stochastic: false
save_name: null
random: false
infer_iter: 1
eval_also: false
viz_gt: false
viz_pred: null
load_prior: null
debug_viz: false

# preprocess
save_contacts: false
preprocess: false
load_indices: null

# feedforward
feedforward: false
use_vit: false

# transfer
transfer_from: null
eval_model: null

# text2hoi
text2hoi: false